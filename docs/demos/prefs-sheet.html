<!--
  交互 demo：首选项（审查 docs/archive/audit-2026-10-06.md 第一节第 3 点；交接 docs/archive/handoff-2026-10-07-remaining.md §2）。
  只出 demo，不接进 App。底座 services/appPrefs.ts 已在；这里每一项以后都是 AppPrefs 的一个字段（设备级的除外）。

  照现在 App 搬的：
    「我的」页（AppHeader 的同步 / 单位按钮、头像区、训练活跃度卡、累计训练、记录体重、身体数据 & 指标、底栏与印章 FAB）；
    弹层外壳与头部（ExercisePickerSheet：92% 高、顶部 22px 圆角、抓手、宋体 18px 标题、右上 ×）；
    分组卡（ProfileTab 设置卡：ui-card p-5，小节名 ui-section-label + bg-inset 分段块，选中＝朱砂实底）；
    开关行（ProfileTab 振动 / 撤销那两行：粗体名 … 右侧「开」朱砂 /「关」三级灰）；
    数据区（BackupCard 的 ui-btn-secondary 三个按钮、导入的后果说明、导入前副本那行状态；重置账户 = 原来的危险行）；
    外观三档带图标（原样）；数据环境行（原样，仅未锁定构建出现）；撤销条 / toast（UiOverlayContext）。

  新的只有这些：
    1. 「我的」页底部的设置卡换成一行「首选项 ›」，右侧是当前值摘要（状态，不是说明）。
    2. 整页底部弹层「首选项」，分 训练 / 动作 / 显示 / 设备 / 数据 五组，组名用「身体数据 & 指标」那种节标题。
    3. 行里去掉了 40px 图标方块（审查 settings-card-mixed-rows）：只剩「小节名 + 分段块」和「名称 … 值」两种行；
       开关行左右内边距收成和小节名对齐。
    4. 动效三档改成自解释的档名（跟系统 / 总有动效 / 减弱），删掉每档下面那行小字。
    5. 有氧默认记录＝分段块的多选版（可同时选中多格，至少留一格）。
    6. 备份卡去掉了云图标、标题下的说明和「你的数据，始终属于你。」；导入的后果说明留着。
    7. 同步一行：右侧显示同步状态，点一下立即同步（和顶栏那颗按钮同一件事）。

  取舍（等拍板）：
    · ±步长 / 递减每档 kg 和 lbs 共用一个数（用户 10-06 定），所以各只有一行；选项取两套的并集
      ±步长 1 / 2.5 / 5 / 10，递减 2.5 / 5 / 10 / 15，数值跟着当前重量单位读。
    · 「动作库与标签 ›」在 demo 里只弹 toast（真实现跳到添加动作弹层的整理态）。
    · 语言切到 English 在 demo 里只改摘要；外观真的切深浅色；振动开的时候 navigator.vibrate 一下。
-->

(() => {
  'use strict';
  const $ = s => document.querySelector(s);
  const svg = (w, body, extra = '') => `<svg class="ic" width="${w}" height="${w}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ${extra}>${body}</svg>`;
  const I = {
    x: svg(21, '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>', 'stroke-width="2"'),
    chev: svg(18, '<path d="m9 18 6-6-6-6"/>', 'stroke-width="2"'),
    chevS: svg(16, '<path d="m9 18 6-6-6-6"/>', 'stroke-width="2"'),
    check: svg(18, '<path d="M20 6 9 17l-5-5"/>', 'stroke-width="2.5"'),
    checkS: svg(14, '<path d="M20 6 9 17l-5-5"/>', 'stroke-width="2.5"'),
    sync: svg(14, '<path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/>', 'style="animation:spin 1s linear infinite"'),
    phone: svg(18, '<rect width="14" height="20" x="5" y="2" rx="2" ry="2"/><path d="M12 18h.01"/>'),
    sun: svg(18, '<circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/>'),
    moon: svg(18, '<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>'),
    dl: svg(18, '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/>'),
    ul: svg(18, '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m17 8-5-5-5 5"/><path d="M12 3v12"/>'),
    undo: svg(18, '<path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5a5.5 5.5 0 0 1-5.5 5.5H11"/>'),
    act: svg(13, '<path d="M22 12h-2.48a2 2 0 0 0-1.93 1.46l-2.35 8.36a.25.25 0 0 1-.48 0L9.24 2.18a.25.25 0 0 0-.48 0l-2.35 8.36A2 2 0 0 1 4.49 12H2"/>'),
    cam: svg(16, '<path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/>', 'stroke-width="2"'),
    scale: svg(24, '<path d="m16 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/><path d="m2 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/><path d="M7 21h10"/><path d="M12 3v18"/><path d="M3 7h2c2 0 5-1 7-2 2 1 5 2 7 2h2"/>', 'stroke-width="2"'),
    plus: svg(20, '<path d="M5 12h14"/><path d="M12 5v14"/>', 'stroke-width="2"'),
    plusS: svg(14, '<path d="M5 12h14"/><path d="M12 5v14"/>', 'stroke-width="2"'),
    plusL: svg(26, '<path d="M5 12h14"/><path d="M12 5v14"/>', 'stroke-width="2.5"'),
    bars: svg(20, '<path d="M3 3v16a2 2 0 0 0 2 2h16"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/>'),
    cal: svg(20, '<path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/>'),
    user: svg(20, '<circle cx="12" cy="8" r="5"/><path d="M20 21a8 8 0 0 0-16 0"/>'),
  };

  // ── 状态：以后 AppPrefs 的字段（跟数据走）+ 设备级（跟设备走） ──
  const P = {
    unit: 'lbs',            // appPrefs.unit（和顶栏同一个）
    step: 5,                // appPrefs.step：±步长，kg / lbs 共用
    drop: 5,                // appPrefs.dropStep：递减每档，kg / lbs 共用
    scrub: 'mid',           // 设备：滑动手感 细 / 中 / 粗
    cardio: ['dur', 'dist'],// appPrefs.cardioMetrics
    dist: 'km',             // appPrefs.distUnit
    theme: 'auto',          // 设备
    motion: 'auto',         // 设备
    lang: 'cn',             // appPrefs.lang
    week: 'mon',            // appPrefs.weekStart
    haptics: true,          // 设备
    undoDel: false,         // 设备（undoPref，默认关）
    devMode: true,          // 数据环境（仅未锁定构建）
  };
  let sync = 'ok', syncAt = Date.now() - 2 * 60e3, rollback = { workouts: 141, date: '2026-10-07' };

  // ── 「我的」页静态部分 ──
  $('#hsync').innerHTML = I.check;
  $('#cam').innerHTML = I.cam;
  $('#actT').insertAdjacentHTML('afterbegin', I.act);
  $('#scale').innerHTML = I.scale;
  $('#lwplus').innerHTML = I.plus;
  $('#addm').insertAdjacentHTML('afterbegin', I.plusS);
  $('#newm').insertAdjacentHTML('afterbegin', `<span style="padding:8px;color:var(--text-secondary)">${I.plusS}</span>`);
  $('#entryChev').outerHTML = I.chev;
  $('#fab').innerHTML = I.plusL;
  $('#nav1').insertAdjacentHTML('afterbegin', I.bars);
  $('#nav2').insertAdjacentHTML('afterbegin', I.cal);
  $('#nav3').insertAdjacentHTML('afterbegin', I.user);
  $('#close').innerHTML = I.x;
  $('#hm').innerHTML = Array.from({ length: 35 }, (_, i) => `<span class="${[2, 4, 9, 11, 16, 18, 23, 25, 30, 32].includes(i) ? (i % 3 ? 'l2' : 'l1') : ''}"></span>`).join('');

  const fmt = n => String(n);
  const ago = () => { const m = Math.round((Date.now() - syncAt) / 60e3); return m < 1 ? '刚刚' : `${m} 分钟前`; };

  // 摘要（审查原文：「±5 lbs · 递减 −5 · 中文」）
  const renderTop = () => {
    $('#hunit').textContent = P.unit;
    $('#summary').textContent = `±${fmt(P.step)} ${P.unit} · 递减 −${fmt(P.drop)} · ${P.lang === 'cn' ? '中文' : 'English'}`;
  };

  // ── 弹层内容 ──
  const seg = (key, opts, cls = '') =>
    `<div class="seg" style="grid-template-columns:repeat(${opts.length},1fr)">${opts.map(o => {
      const on = Array.isArray(P[key]) ? P[key].includes(o.v) : P[key] === o.v;
      return `<button type="button" class="${cls}${on ? ' on' : ''}" data-k="${key}" data-v="${o.v}" aria-pressed="${on}">${o.i || ''}<span>${o.t}</span></button>`;
    }).join('')}</div>`;
  const item = (label, body, aside = '') => `<div class="item"><p class="lab"><span>${label}</span>${aside}</p>${body}</div>`;
  const sw = (key, name) =>
    `<button type="button" class="row" role="switch" aria-checked="${P[key]}" data-sw="${key}"><span class="n">${name}</span><span class="v${P[key] ? ' on' : ''}">${P[key] ? '开' : '关'}</span></button>`;
  const nums = a => a.map(v => ({ v, t: fmt(v) }));

  const render = () => {
    const syncV = sync === 'busy'
      ? `<span class="v">${I.sync}同步中</span>`
      : `<span class="v ok">${I.checkS}已同步 · ${ago()}</span>`;
    $('#sbody').innerHTML = `
      <section class="grp"><h3>训练</h3><div class="card">
        ${item('重量单位', seg('unit', [{ v: 'kg', t: 'kg' }, { v: 'lbs', t: 'lbs' }], 'num'))}
        ${item('加减步长', seg('step', nums([1, 2.5, 5, 10]), 'num'), `<i>${P.unit}</i>`)}
        ${item('递减每档', seg('drop', nums([2.5, 5, 10, 15]), 'num'), `<i>${P.unit}</i>`)}
        ${item('滑动手感', seg('scrub', [{ v: 'fine', t: '细' }, { v: 'mid', t: '中' }, { v: 'coarse', t: '粗' }]))}
        ${sw('undoDel', '删组 / 删动作后可撤销')}
      </div></section>

      <section class="grp"><h3>动作</h3><div class="card">
        ${item('有氧默认记录', seg('cardio', [{ v: 'dur', t: '时长' }, { v: 'dist', t: '距离' }, { v: 'speed', t: '速度' }, { v: 'reps', t: '次数' }]))}
        ${item('距离单位', seg('dist', [{ v: 'km', t: 'km' }, { v: 'mi', t: 'mi' }], 'num'))}
        <button type="button" class="row" id="gotoLib"><span class="n">动作库与标签</span><span class="v">${I.chevS}</span></button>
      </div></section>

      <section class="grp"><h3>显示</h3><div class="card">
        ${item('外观', seg('theme', [{ v: 'auto', t: '跟随系统', i: I.phone }, { v: 'light', t: '浅色', i: I.sun }, { v: 'dark', t: '深色', i: I.moon }]))}
        ${item('动效', seg('motion', [{ v: 'auto', t: '跟系统' }, { v: 'keep', t: '总有动效' }, { v: 'reduce', t: '减弱' }]))}
        ${item('语言', seg('lang', [{ v: 'cn', t: '中文' }, { v: 'en', t: 'English' }]))}
        ${item('每周开始于', seg('week', [{ v: 'mon', t: '周一' }, { v: 'sun', t: '周日' }]))}
      </div></section>

      <section class="grp"><h3>设备</h3><div class="card">
        ${sw('haptics', '振动反馈')}
      </div></section>

      <section class="grp"><h3>数据</h3><div class="card">
        <button type="button" class="row" id="syncRow"><span class="n">同步</span>${syncV}</button>
        <div class="hr"></div>
        <button type="button" class="btn2" id="exp">${I.dl}立即导出备份</button>
        <button type="button" class="btn2" id="imp">${I.ul}导入备份</button>
        <p class="note">从导出的 JSON 文件恢复。当前数据会被完全替换，导入前会自动存一份可撤销的副本</p>
        ${rollback ? `<button type="button" class="btn2" id="rb">${I.undo}撤销上次导入</button>
        <p class="note">导入前的副本 · ${rollback.workouts} 次训练 · ${rollback.date}</p>` : ''}
        <div class="hr"></div>
        <button type="button" class="row dev" id="devRow"><span class="n">数据环境<span class="sub">${P.devMode ? 'state-dev · FitLogDB-dev · 与真实数据完全隔离' : 'state · FitLogDB · 真实用户数据'}</span></span><span class="tag">${P.devMode ? '开发' : '用户'}</span></button>
        <div class="hr"></div>
        <button type="button" class="row danger" id="reset"><span class="n">重置账户</span><span class="v">${I.chevS}</span></button>
      </div></section>`;
  };

  const applyTheme = () => {
    if (P.theme === 'auto') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', P.theme);
  };

  let toastTimer;
  const toast = msg => {
    clearTimeout(toastTimer);
    $('#toastHost').innerHTML = `<div class="toast"><span class="msg">${msg}</span></div>`;
    toastTimer = setTimeout(() => { $('#toastHost').innerHTML = ''; }, 2600);
  };

  $('#sbody').addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    if (b.dataset.k) {
      const k = b.dataset.k;
      const raw = b.dataset.v;
      const v = isNaN(+raw) ? raw : +raw;
      if (Array.isArray(P[k])) {
        const has = P[k].includes(v);
        if (has && P[k].length === 1) return; // 至少留一格
        P[k] = has ? P[k].filter(x => x !== v) : [...P[k], v];
      } else P[k] = v;
      if (k === 'theme') applyTheme();
    } else if (b.dataset.sw) {
      const k = b.dataset.sw;
      P[k] = !P[k];
      if (k === 'haptics' && P[k] && navigator.vibrate) navigator.vibrate(10);
    } else if (b.id === 'syncRow' || b.id === 'devRow') {
      if (b.id === 'devRow') { P.devMode = !P.devMode; }
      else if (sync !== 'busy') {
        sync = 'busy';
        setTimeout(() => { sync = 'ok'; syncAt = Date.now(); render(); }, 900);
      }
    } else if (b.id === 'gotoLib') return toast('（demo）这里跳到添加动作弹层的整理态');
    else if (b.id === 'exp') return toast('已导出 fitlog-backup-2026-10-18.json');
    else if (b.id === 'imp') return toast('（demo）这里打开选文件');
    else if (b.id === 'rb') { rollback = null; toast('已恢复到导入前'); }
    else if (b.id === 'reset') return toast('（demo）这里弹现有的重置确认框');
    else return;
    const top = $('#sbody').scrollTop;
    render(); renderTop();
    $('#sbody').scrollTop = top;
  });

  $('#hunit').addEventListener('click', () => { P.unit = P.unit === 'kg' ? 'lbs' : 'kg'; renderTop(); render(); });
  $('#hsync').addEventListener('click', () => { syncAt = Date.now(); render(); });

  // ── 开 / 关弹层；抓手和头部可下拉关闭 ──
  const sheet = $('#sheet'), scrim = $('#scrim');
  const open = () => { render(); $('#sbody').scrollTop = 0; sheet.classList.add('on'); scrim.classList.add('on'); };
  const close = () => { sheet.classList.remove('on', 'dragging'); sheet.style.transform = ''; scrim.classList.remove('on'); };
  $('#entry').addEventListener('click', open);
  $('#close').addEventListener('click', close);
  scrim.addEventListener('click', close);
  let y0 = null;
  const down = e => { if (e.target.closest('#close')) return; y0 = e.clientY; sheet.classList.add('dragging'); e.currentTarget.setPointerCapture(e.pointerId); };
  const move = e => { if (y0 == null) return; sheet.style.transform = `translateY(${Math.max(0, e.clientY - y0)}px)`; };
  const up = e => {
    if (y0 == null) return;
    const dy = e.clientY - y0; y0 = null;
    sheet.classList.remove('dragging'); sheet.style.transform = '';
    if (dy > 90) close();
  };
  for (const el of [$('#grab'), $('#shead')]) {
    el.addEventListener('pointerdown', down);
    el.addEventListener('pointermove', move);
    el.addEventListener('pointerup', up);
    el.addEventListener('pointercancel', up);
  }

  renderTop();
  render();
  // 截图用：?open 直接打开弹层（不走过渡），?page 「我的」页滚到底
  const q = new URLSearchParams(location.search);
  if (q.has('open')) { sheet.style.transition = scrim.style.transition = 'none'; open(); }
  if (q.has('page')) $('#page').scrollTop = 1e5;
})();
</script>
</body>
</html>
