<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Demo · 首选项</title>
<!--
  交互 demo：首选项弹层第二版结构（按 Refactoring UI 诊断重排；2026-10-26 用户拍板，已照此实现在 PrefsSheet / prefsRows / DataSafetySection）。
  配色、字体、圆角照现在的 index.css（白底浅灰卡、青强调色、Noto Sans SC + Barlow Condensed）。

  结构
    · 五组：单位与记录 / 手感 / 外观与地区 / 数据 / 账户。按「这一项管什么」分，不按存在哪里分
      （滑动手感、振动、动效都是手上的感觉，归一组；语言和周起始日是地区，跟外观放一起）。
    · 卡片里只有一种行：名称在左，控件在右；控件放不下（3 档以上带图标、4 档数字、多选）才落到名称下面整宽。
      二选一（kg / lbs、km / mi、中文 / English、周一 / 周日）和三个短档（细中粗、动效）都在同一行。
    · 层级：组标题 12px 600 灰，组与组隔 32px；行名 14px 500，不再加粗；值和副文字 12px 三级灰。
      行与行用分隔线，卡内不再混用间距和分隔线。
    · ±步长和递减合成一行「未标器材的动作」，单位写在行名旁，两条分段块各带一个短标签。
    · 强调色只剩五个色点（读屏用 aria-label 念名字）。
    · 振动是真开关。
    · 数据组只剩四行：同步 / 自动备份 › / 导出 › / 导入 ›，按钮堆进二级页。
      全页只有一个实心主按钮：备份没开时在主页「自动备份」行上（选择文件夹），开了以后在备份二级页（立即备份）。
      「撤销上次导入」只在有副本时出现，是一行。
    · 数据环境、退出登录、重置账户单独成「账户」卡放最底。

  删掉的说明文字（照「界面里不写说明文字」）：「一行一组，可用 Excel 打开或交给 AI 分析」「也可选 SD 卡或坚果云…」。
  保留的是状态和后果：备份状态、导入会替换当前数据、导入前副本那行。

  demo 限定：顶部「状态」几个小块切换备份正常 / 未开 / 失败、有没有导入副本、有没有远端；
  外观真的切深浅色，强调色真的换；跳转类按钮只弹 toast。?open 直接打开弹层，?open=backup|export|import 打开二级页。
-->
<style>
  @font-face{font-family:'Noto Sans SC';src:url('/fonts/noto-sans-sc.woff2') format('woff2-variations'),url('../../public/fonts/noto-sans-sc.woff2') format('woff2-variations');font-weight:400 700;font-display:block}
  @font-face{font-family:'Barlow Condensed';src:url('/fonts/barlow-condensed-600.woff2') format('woff2'),url('../../public/fonts/barlow-condensed-600.woff2') format('woff2');font-weight:600;font-display:block}

  :root{
    --bg-desk:#E3E5E9;
    --bg-base:#FFFFFF; --bg-card:#F4F5F7; --bg-card-hover:#ECEEF1; --bg-inset:#E9EBEF; --bg-btn:#E9EBEF;
    --divider:#E3E5E9;
    --text-primary:#111316; --text-secondary:#43474E; --text-tertiary:#626872;
    --accent:#12B39A; --accent-ink:#0E9A84; --accent-text:#097464; --text-on-accent:#04211C;
    --seg-pill:#FFFFFF; --seg-shadow:0 1px 2px rgba(17,19,22,.10),0 0 0 .5px rgba(17,19,22,.06);
    --success:#2F6B45; --warning:#7A5A10; --warning-soft:#EFE8D6; --danger:#A3241F; --danger-soft:#F2DCDA;
    --scrim:rgba(22,24,27,.42);
    --shadow-overlay:0 2px 6px rgba(22,24,27,.10),0 18px 40px -24px rgba(22,24,27,.30);
    --radius-card:4px; --radius-control:4px; --radius-chip:2px;
    --dur-tap:120ms; --dur-base:220ms; --ease-paper:cubic-bezier(.2,.8,.2,1);
    --f-sans:'Noto Sans SC',-apple-system,'PingFang SC','Microsoft YaHei',system-ui,sans-serif;
    --f-num:'Barlow Condensed','Noto Sans SC',system-ui,sans-serif;
    --pw:384px;
  }
  :root[data-accent="sky"]{--accent:#0EA5E9;--accent-ink:#0284C7;--accent-text:#0369A1;--text-on-accent:#03202E}
  :root[data-accent="violet"]{--accent:#7C3AED;--accent-ink:#6D28D9;--accent-text:#6D28D9;--text-on-accent:#FFFFFF}
  :root[data-accent="rose"]{--accent:#E11D5C;--accent-ink:#C2154D;--accent-text:#C4134C;--text-on-accent:#FFFFFF}
  :root[data-accent="orange"]{--accent:#F97316;--accent-ink:#EA580C;--accent-text:#BB3F0C;--text-on-accent:#1F1205}
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg-desk:#05080A; --bg-base:#0D1216; --bg-card:#172028; --bg-card-hover:#1D2731; --bg-inset:#080B0E; --bg-btn:#25303A;
      --divider:#25303A; --text-primary:#F2F5F7; --text-secondary:#A9B4BE; --text-tertiary:#8693A0;
      --accent:#2BE0C0; --accent-ink:#5BF0D6; --accent-text:#2BE0C0; --text-on-accent:#06201C;
      --seg-pill:#2A3642; --seg-shadow:0 1px 2px rgba(0,0,0,.45);
      --success:#7FBF92; --warning:#D2AE5C; --warning-soft:#2A2416; --danger:#EF7A70; --danger-soft:#331714; --scrim:rgba(0,0,0,.6);
      --shadow-overlay:0 2px 6px rgba(0,0,0,.45),0 18px 40px -24px rgba(0,0,0,.8);
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg-desk:#05080A; --bg-base:#0D1216; --bg-card:#172028; --bg-card-hover:#1D2731; --bg-inset:#080B0E; --bg-btn:#25303A;
    --divider:#25303A; --text-primary:#F2F5F7; --text-secondary:#A9B4BE; --text-tertiary:#8693A0;
    --accent:#2BE0C0; --accent-ink:#5BF0D6; --accent-text:#2BE0C0; --text-on-accent:#06201C;
    --seg-pill:#2A3642; --seg-shadow:0 1px 2px rgba(0,0,0,.45);
    --success:#7FBF92; --warning:#D2AE5C; --warning-soft:#2A2416; --danger:#EF7A70; --danger-soft:#331714; --scrim:rgba(0,0,0,.6);
    --shadow-overlay:0 2px 6px rgba(0,0,0,.45),0 18px 40px -24px rgba(0,0,0,.8);
    color-scheme:dark;
  }
  [hidden]{display:none!important}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden}
  body{background:var(--bg-desk);color:var(--text-primary);font:14px/1.5 var(--f-sans);-webkit-user-select:none;user-select:none}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-appearance:none;appearance:none;text-align:inherit}
  .ic{flex:none;display:block}
  .phone{position:relative;height:100%;max-width:var(--pw);margin:0 auto;overflow:hidden;background:var(--bg-base)}
  @media (min-width:400px){ .phone{box-shadow:var(--shadow-overlay)} }

  /* ── 「我的」页（只留到首选项入口为止的骨架） ── */
  .page{position:absolute;inset:0;overflow-y:auto;scrollbar-width:none;padding-bottom:96px}
  .page::-webkit-scrollbar{display:none}
  .hdr{position:sticky;top:0;z-index:20;background:var(--bg-base);border-bottom:1px solid var(--divider);padding:56px 24px 16px;display:flex;justify-content:space-between;align-items:center}
  .hdr h1{font-size:18px;font-weight:700}
  .hunit{background:var(--bg-card);border:1px solid var(--divider);padding:6px 12px;border-radius:var(--radius-control);font-size:12px;font-weight:600;text-transform:uppercase;color:var(--accent-text)}
  .main{padding:16px;display:flex;flex-direction:column;gap:24px}
  .card{background:var(--bg-card);border:1px solid var(--divider);border-radius:var(--radius-card)}
  .stat{padding:24px;display:flex;flex-direction:column;align-items:center;gap:8px}
  .stat b{font:600 40px/1 var(--f-num)}
  .stat span{font-size:12px;color:var(--text-secondary)}
  .entry{width:100%;padding:16px;display:flex;justify-content:space-between;align-items:center;gap:12px}
  .entry .n{font-weight:600;white-space:nowrap}
  .entry .v{display:flex;align-items:center;gap:6px;min-width:0;font-size:12px;color:var(--text-secondary)}
  .entry .v span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .entry .v .ic{color:var(--text-tertiary)}
  .nav{position:absolute;left:0;right:0;bottom:0;z-index:30;height:64px;background:var(--bg-base);border-top:1px solid var(--divider);display:grid;grid-template-columns:repeat(4,1fr)}
  .nav div{display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--text-tertiary)}
  .nav div.on{color:var(--accent-text)}

  /* ── 弹层外壳（ExercisePickerSheet 原样） ── */
  .scrim{position:absolute;inset:0;z-index:90;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity var(--dur-base) var(--ease-paper)}
  .scrim.on{opacity:1;pointer-events:auto}
  .sheet{position:absolute;left:0;right:0;bottom:0;z-index:100;height:92%;display:flex;flex-direction:column;background:var(--bg-base);
    border-top:1px solid var(--divider);border-radius:22px 22px 0 0;transform:translateY(105%);transition:transform var(--dur-base) var(--ease-paper)}
  .sheet.on{transform:translateY(0)}
  .sheet.dragging{transition:none}
  .grab{flex:none;padding:10px 0 6px;touch-action:none;cursor:grab}
  .grab i{display:block;width:48px;height:6px;border-radius:999px;background:var(--divider);margin:0 auto}
  .shead{flex:none;display:flex;align-items:center;gap:4px;padding:6px 16px 2px;min-height:52px;touch-action:none}
  .shead h2{font-size:18px;font-weight:600;white-space:nowrap}
  .sicon{width:44px;height:44px;flex:none;display:flex;align-items:center;justify-content:center;color:var(--text-secondary);border-radius:var(--radius-control)}
  #close{margin-left:auto;margin-right:-10px}
  #back{margin-left:-12px}
  .sbody{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:8px 16px 48px;display:flex;flex-direction:column;gap:32px;scrollbar-width:none}
  .sbody::-webkit-scrollbar{display:none}
  .sbody.enter{animation:slidein var(--dur-base) var(--ease-paper)}
  .sbody.enter-back{animation:slideback var(--dur-base) var(--ease-paper)}
  @keyframes slidein{from{transform:translateX(24px);opacity:0}}
  @keyframes slideback{from{transform:translateX(-24px);opacity:0}}

  /* ── 分组：组标题在卡外；卡里一行一条分隔线 ── */
  .grp{display:flex;flex-direction:column;gap:8px}
  .grp > h3{padding:0 4px;font-size:12px;font-weight:600;color:var(--text-secondary)}
  .grp > .card{padding:0 16px}
  .grp > .card > * + *{border-top:1px solid var(--divider)}

  .row{width:100%;min-height:52px;padding:10px 0;display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:left}
  button.row{transition:background-color var(--dur-tap) var(--ease-paper)}
  button.row:active{background:var(--bg-card-hover);box-shadow:0 0 0 16px var(--bg-card-hover);clip-path:inset(0 -16px)}
  .row .tx{min-width:0;display:flex;flex-direction:column;gap:2px}
  .row .n{font-size:14px;font-weight:500;color:var(--text-primary)}
  .row .n i{font:600 13px var(--f-num);font-style:normal;color:var(--text-tertiary);margin-left:6px}
  .row .sub{font-size:12px;line-height:1.45;color:var(--text-tertiary)}
  .row .sub.bad{color:var(--danger)}
  .row .v{flex:none;font-size:12px;font-weight:500;color:var(--text-tertiary);display:flex;align-items:center;gap:6px;white-space:nowrap}
  .row .v.ok{color:var(--success)}
  .row .v.bad{color:var(--danger)}
  .row .v .spin{animation:spin 1s linear infinite}
  .row.danger .n{color:var(--danger)}
  .row.act .n{color:var(--accent-text)}
  @keyframes spin{to{transform:rotate(360deg)}}
  /* 落到名称下面的整宽控件 */
  .row.stack{flex-direction:column;align-items:stretch;gap:10px;padding:12px 0 14px}
  .pair{display:grid;grid-template-columns:36px 1fr;align-items:center;gap:8px}
  .pair > span{font-size:12px;color:var(--text-tertiary)}

  /* 分段块（index.css .seg-on：凹槽 + 白药丸） */
  .seg{display:grid;gap:2px;padding:3px;background:var(--bg-inset);border-radius:var(--radius-control)}
  .seg button{min-height:34px;padding:6px 0;border-radius:var(--radius-chip);font-size:12px;font-weight:500;color:var(--text-secondary);text-align:center;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;transition:background-color var(--dur-tap) var(--ease-paper),color var(--dur-tap) var(--ease-paper)}
  .seg button.num{font:600 15px var(--f-num);font-variant-numeric:tabular-nums}
  .seg button.on{background:var(--seg-pill);color:var(--text-primary);box-shadow:var(--seg-shadow)}
  .seg button.on svg{color:var(--accent-text)}
  .seg.icons button{min-height:52px}
  .seg.inline{flex:none;display:inline-grid;grid-auto-columns:minmax(44px,auto);grid-auto-flow:column}
  .seg.inline button{min-height:30px;padding:4px 12px}

  /* 强调色：只有色点 */
  .dots{flex:none;display:flex;gap:2px}
  .dots button{width:34px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:50%}
  .dots button span{width:22px;height:22px;border-radius:50%;transition:box-shadow var(--dur-tap) var(--ease-paper)}
  .dots button.on span{box-shadow:0 0 0 2px var(--bg-card),0 0 0 4px var(--text-primary)}

  /* 开关 */
  .tgl{flex:none;position:relative;width:44px;height:26px;border-radius:999px;background:var(--bg-inset);box-shadow:inset 0 0 0 1px var(--divider);transition:background-color var(--dur-tap) var(--ease-paper)}
  .tgl::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--seg-pill);box-shadow:var(--seg-shadow);transition:transform var(--dur-base) var(--ease-paper)}
  .tgl.on{background:var(--accent);box-shadow:none}
  .tgl.on::after{transform:translateX(18px);background:#fff}

  /* 全页唯一的实心主按钮 */
  .pbtn{flex:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 14px;border-radius:var(--radius-control);
    background:var(--accent);color:var(--text-on-accent);font-size:14px;font-weight:600;transition:background-color var(--dur-tap) var(--ease-paper)}
  .pbtn:active{background:var(--accent-ink)}
  .pbtn.wide{width:100%;padding:12px 16px}
  .tag{flex:none;font-size:12px;font-weight:600;padding:3px 10px;border-radius:var(--radius-chip);background:var(--bg-inset);color:var(--text-secondary)}
  .tag.dev{background:var(--warning-soft);color:var(--warning)}

  /* toast（UiOverlayContext 原样） */
  .toast{position:absolute;left:16px;right:16px;bottom:24px;z-index:190;padding:12px 16px;background:var(--bg-card);border:1px solid var(--divider);
    border-radius:var(--radius-card);box-shadow:var(--shadow-overlay);font-size:14px;font-weight:500}
  /* demo 状态切换（不属于设计） */
  .demobar{position:absolute;top:0;left:0;right:0;z-index:130;display:flex;flex-wrap:wrap;align-items:center;gap:4px;padding:6px 12px;font-size:11px;color:var(--text-tertiary)}
  .demobar b{font-weight:500;margin-right:4px}
  .demobar button{padding:2px 8px;border-radius:999px;border:1px dashed var(--divider);color:var(--text-tertiary)}
  .demobar button.on{border-style:solid;border-color:var(--text-tertiary);color:var(--text-primary)}
  @media (prefers-reduced-motion:reduce){ .sheet,.scrim{transition-duration:1ms} .sbody.enter,.sbody.enter-back{animation:none} }
</style>
</head>
<body>
<div class="phone" id="phone">
  <div class="demobar" id="demobar"></div>
  <div class="page" id="page">
    <header class="hdr"><h1>健身记录</h1><button class="hunit" id="hunit"></button></header>
    <main class="main">
      <div class="card stat"><b>142</b><span>累计训练</span></div>
      <div class="card"><button class="entry" id="entry" data-testid="prefs-entry">
        <span class="n">首选项</span><span class="v"><span id="summary"></span><b id="entryChev"></b></span>
      </button></div>
    </main>
  </div>
  <nav class="nav"><div></div><div>个人记录</div><div>训练计划</div><div class="on">我的</div></nav>

  <div class="scrim" id="scrim"></div>
  <section class="sheet" id="sheet" role="dialog" aria-label="首选项">
    <div class="grab" id="grab"><i></i></div>
    <div class="shead" id="shead">
      <button class="sicon" id="back" aria-label="返回" hidden></button>
      <h2 id="stitle">首选项</h2>
      <button class="sicon" id="close" aria-label="关闭"></button>
    </div>
    <div class="sbody" id="sbody"></div>
  </section>
  <div id="toastHost"></div>
</div>

<script>
(() => {
  'use strict';
  const $ = s => document.querySelector(s);
  const svg = (w, body, extra = '') => `<svg class="ic" width="${w}" height="${w}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ${extra}>${body}</svg>`;
  const I = {
    x: svg(21, '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>', 'stroke-width="2"'),
    back: svg(22, '<path d="m15 18-6-6 6-6"/>', 'stroke-width="2"'),
    chev: svg(16, '<path d="m9 18 6-6-6-6"/>', 'stroke-width="2"'),
    check: svg(14, '<path d="M20 6 9 17l-5-5"/>', 'stroke-width="2.5"'),
    alert: svg(14, '<circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/>', 'stroke-width="2"'),
    sync: svg(14, '<path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/>', 'class="spin"'),
    phone: svg(18, '<rect width="14" height="20" x="5" y="2" rx="2" ry="2"/><path d="M12 18h.01"/>'),
    sun: svg(18, '<circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/>'),
    moon: svg(18, '<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>'),
  };

  // ── 设置（App 里的 appPrefs / 设备级） ──
  const P = {
    unit: 'kg', step: 5, drop: 5, cardio: ['dur', 'dist'], dist: 'km',
    scrub: 'mid', haptics: true, motion: 'auto',
    theme: 'auto', accent: 'teal', lang: 'cn', week: 'mon',
    devMode: true,
  };
  // ── demo 状态 ──
  const D = { backup: 'ok', rollback: true, remote: true };
  let sync = 'ok', syncAt = Date.now() - 2 * 60e3, view = 'main';

  $('#entryChev').outerHTML = I.chev;
  $('#close').innerHTML = I.x;
  $('#back').innerHTML = I.back;

  const ago = () => { const m = Math.round((Date.now() - syncAt) / 60e3); return m < 1 ? '刚刚' : `${m} 分钟前`; };
  const renderTop = () => {
    $('#hunit').textContent = P.unit;
    $('#summary').textContent = `±${P.step} ${P.unit} · 递减 −${P.drop} · ${P.lang === 'cn' ? '中文' : 'English'}`;
  };

  // ── 积木 ──
  const seg = (key, opts, cls = '', inline = false) =>
    `<div class="seg${inline ? ' inline' : ''}${opts.some(o => o.i) ? ' icons' : ''}" ${inline ? '' : `style="grid-template-columns:repeat(${opts.length},1fr)"`}>${opts.map(o => {
      const on = Array.isArray(P[key]) ? P[key].includes(o.v) : P[key] === o.v;
      return `<button type="button" class="${cls}${on ? ' on' : ''}" data-k="${key}" data-v="${o.v}" aria-pressed="${on}">${o.i || ''}<span>${o.t}</span></button>`;
    }).join('')}</div>`;
  const nums = a => a.map(v => ({ v, t: String(v) }));
  const name = (n, sub = '', subCls = '') => `<span class="tx"><span class="n">${n}</span>${sub ? `<span class="sub ${subCls}">${sub}</span>` : ''}</span>`;
  // 一行：名称在左，控件在右
  const line = (n, ctl) => `<div class="row">${name(n)}${ctl}</div>`;
  // 控件放不下：落到名称下面
  const stack = (n, ctl) => `<div class="row stack">${typeof n === 'string' ? `<span class="n">${n}</span>` : n}${ctl}</div>`;
  const go = (id, n, v = '', sub = '', subCls = '', cls = '') =>
    `<button type="button" class="row ${cls}" data-go="${id}">${name(n, sub, subCls)}<span class="v">${v}${I.chev}</span></button>`;
  const grp = (title, body) => `<section class="grp">${title ? `<h3>${title}</h3>` : ''}<div class="card">${body}</div></section>`;

  const ACCENTS = [
    { v: 'teal', t: '青', c: ['#12B39A', '#2BE0C0'] },
    { v: 'sky', t: '浅蓝', c: ['#0EA5E9', '#38BDF8'] },
    { v: 'violet', t: '紫', c: ['#7C3AED', '#7445F0'] },
    { v: 'rose', t: '玫红', c: ['#E11D5C', '#E0245C'] },
    { v: 'orange', t: '橙', c: ['#F97316', '#FF8A3D'] },
  ];
  const isDark = () => P.theme === 'dark' || (P.theme === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);

  const syncValue = () => sync === 'busy'
    ? `<span class="v">${I.sync}同步中</span>`
    : `<span class="v ok">${I.check}已同步 · ${ago()}</span>`;

  // 自动备份在主页的那一行：没开时带全页唯一的主按钮
  const backupRow = () => {
    if (D.backup === 'off') return `<div class="row">${name('自动备份', '未开启 · 卸载 App 会丢失全部记录', 'bad')}<button type="button" class="pbtn" data-act="choose">选择文件夹</button></div>`;
    if (D.backup === 'error') return go('backup', '自动备份', `<span class="v bad">${I.alert}失败</span>`, '没有文件夹访问权限', 'bad');
    return go('backup', '自动备份', '今天 21:40');
  };

  const views = {
    main: {
      title: '首选项',
      body: () => [
        grp('单位与记录',
          line('重量单位', seg('unit', [{ v: 'kg', t: 'kg' }, { v: 'lbs', t: 'lbs' }], 'num', true)) +
          line('距离单位', seg('dist', [{ v: 'km', t: 'km' }, { v: 'mi', t: 'mi' }], 'num', true)) +
          stack(`<span class="n">未标器材的动作<i>${P.unit}</i></span>`,
            `<div class="pair"><span>±</span>${seg('step', nums([1, 2.5, 5, 10]), 'num')}</div>` +
            `<div class="pair"><span>递减</span>${seg('drop', nums([2.5, 5, 10, 15]), 'num')}</div>`) +
          stack('有氧默认记录', seg('cardio', [{ v: 'dur', t: '时长' }, { v: 'dist', t: '距离' }, { v: 'speed', t: '速度' }, { v: 'reps', t: '次数' }])) +
          go('lib', '动作库与标签')),
        grp('手感',
          line('滑动手感', seg('scrub', [{ v: 'fine', t: '细' }, { v: 'mid', t: '中' }, { v: 'coarse', t: '粗' }], '', true)) +
          `<button type="button" class="row" role="switch" aria-checked="${P.haptics}" data-sw="haptics">${name('振动反馈')}<span class="tgl${P.haptics ? ' on' : ''}"></span></button>` +
          line('动效', seg('motion', [{ v: 'auto', t: '跟系统' }, { v: 'keep', t: '总有动效' }, { v: 'reduce', t: '减弱' }], '', true))),
        grp('外观与地区',
          stack('外观', seg('theme', [{ v: 'auto', t: '跟随系统', i: I.phone }, { v: 'light', t: '浅色', i: I.sun }, { v: 'dark', t: '深色', i: I.moon }])) +
          line('强调色', `<div class="dots">${ACCENTS.map(a => `<button type="button" class="${P.accent === a.v ? 'on' : ''}" data-k="accent" data-v="${a.v}" aria-label="${a.t}" aria-pressed="${P.accent === a.v}"><span style="background:${a.c[isDark() ? 1 : 0]}"></span></button>`).join('')}</div>`) +
          line('语言', seg('lang', [{ v: 'cn', t: '中文' }, { v: 'en', t: 'English' }], '', true)) +
          line('每周开始于', seg('week', [{ v: 'mon', t: '周一' }, { v: 'sun', t: '周日' }], '', true))),
        grp('数据',
          (D.remote ? `<button type="button" class="row" id="syncRow">${name('同步')}${syncValue()}</button>` : '') +
          backupRow() +
          go('export', '导出') +
          go('import', '导入') +
          (D.rollback ? `<button type="button" class="row act" data-act="rollback">${name('撤销上次导入', '导入前的副本 · 141 次训练 · 10-07 · 留 7 天')}</button>` : '')),
        grp('账户',
          `<button type="button" class="row" id="devRow">${name('数据环境', P.devMode ? 'state-dev · FitLogDB-dev · 与真实数据隔离' : 'state · FitLogDB · 真实用户数据')}<span class="tag${P.devMode ? ' dev' : ''}">${P.devMode ? '开发' : '用户'}</span></button>` +
          (D.remote ? go('logout', '退出登录', '', '', '', 'danger') : '') +
          go('reset', '重置账户', '', '', '', 'danger')),
      ].join(''),
    },
    backup: {
      title: '自动备份',
      body: () => {
        const status = D.backup === 'off'
          ? name('未开启', '卸载 App 会丢失全部记录', 'bad')
          : D.backup === 'error'
            ? name('上次备份失败', '没有文件夹访问权限，重新选一次文件夹', 'bad')
            : name('上次备份 · 今天 21:40', 'Documents/FitLog · 共 12 份');
        const primary = D.backup === 'ok'
          ? `<button type="button" class="pbtn wide" data-act="backupNow">立即备份</button>`
          : `<button type="button" class="pbtn wide" data-act="choose">${D.backup === 'error' ? '重新选择文件夹' : '选择文件夹'}</button>`;
        return [
          grp('', stack(status, primary)),
          grp('',
            (D.backup === 'ok' ? go('folder', '备份文件夹', 'Documents/FitLog') : '') +
            go('restore', '从备份文件夹恢复')),
        ].join('');
      },
    },
    export: {
      title: '导出',
      body: () => grp('',
        go('csv', 'CSV 表格', '分享') +
        (D.backup !== 'off' ? go('csvFolder', 'CSV 表格', '存到备份文件夹') : '') +
        go('json', '完整备份（JSON）')),
    },
    import: {
      title: '导入',
      body: () => grp('',
        go('importJson', '完整备份（JSON）', '', '会替换当前数据，导入前自动留一份可撤销的副本') +
        go('importCsv', '从 Strong / Hevy 导入')),
    },
  };

  const TOASTS = {
    lib: '（demo）跳到动作库整理态', logout: '（demo）弹退出登录确认', reset: '（demo）弹现有的重置确认框',
    folder: '（demo）打开系统文件夹选择器', restore: '（demo）进入恢复流程',
    csv: '（demo）系统分享 fitlog-sets.csv', csvFolder: '已存到 Documents/FitLog', json: '已导出 fitlog-backup-2026-10-25.json',
    importJson: '（demo）打开选文件', importCsv: '（demo）进入 Strong / Hevy 导入流程',
  };

  const render = (dir = '') => {
    const v = views[view];
    $('#stitle').textContent = v.title;
    $('#back').hidden = view === 'main';
    const body = $('#sbody');
    body.innerHTML = v.body();
    if (dir) { body.classList.remove('enter', 'enter-back'); void body.offsetWidth; body.classList.add(dir); }
  };
  const goView = to => { const back = to === 'main'; view = to; render(back ? 'enter-back' : 'enter'); $('#sbody').scrollTop = 0; };

  const applyTheme = () => {
    if (P.theme === 'auto') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', P.theme);
    if (P.accent === 'teal') document.documentElement.removeAttribute('data-accent');
    else document.documentElement.setAttribute('data-accent', P.accent);
  };

  let toastTimer;
  const toast = msg => {
    clearTimeout(toastTimer);
    $('#toastHost').innerHTML = `<div class="toast">${msg}</div>`;
    toastTimer = setTimeout(() => { $('#toastHost').innerHTML = ''; }, 2400);
  };

  $('#sbody').addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    if (b.dataset.k) {
      const k = b.dataset.k, raw = b.dataset.v, v = isNaN(+raw) ? raw : +raw;
      if (Array.isArray(P[k])) {
        const has = P[k].includes(v);
        if (has && P[k].length === 1) return; // 至少留一项
        P[k] = has ? P[k].filter(x => x !== v) : [...P[k], v];
      } else P[k] = v;
      if (k === 'theme' || k === 'accent') applyTheme();
    } else if (b.dataset.sw) {
      P[b.dataset.sw] = !P[b.dataset.sw];
      if (P.haptics && navigator.vibrate) navigator.vibrate(10);
    } else if (b.dataset.go) {
      if (views[b.dataset.go]) return goView(b.dataset.go);
      return toast(TOASTS[b.dataset.go]);
    } else if (b.dataset.act === 'choose') { D.backup = 'ok'; toast('已选择 Documents/FitLog，并完成第一次备份'); renderBar(); }
    else if (b.dataset.act === 'backupNow') return toast('已备份 · 共 13 份');
    else if (b.dataset.act === 'rollback') { D.rollback = false; toast('已恢复到导入前'); renderBar(); }
    else if (b.id === 'devRow') P.devMode = !P.devMode;
    else if (b.id === 'syncRow') {
      if (sync === 'busy') return;
      sync = 'busy';
      setTimeout(() => { sync = 'ok'; syncAt = Date.now(); if (view === 'main') keep(render); }, 900);
    } else return;
    keep(render); renderTop();
  });
  const keep = fn => { const top = $('#sbody').scrollTop; fn(); $('#sbody').scrollTop = top; };

  $('#back').addEventListener('click', () => goView('main'));
  $('#hunit').addEventListener('click', () => { P.unit = P.unit === 'kg' ? 'lbs' : 'kg'; renderTop(); keep(render); });

  // ── demo 状态条 ──
  const renderBar = () => {
    const chip = (on, act, t) => `<button type="button" class="${on ? 'on' : ''}" data-d="${act}">${t}</button>`;
    $('#demobar').innerHTML = `<b>状态</b>` +
      chip(D.backup === 'ok', 'b:ok', '备份正常') + chip(D.backup === 'off', 'b:off', '未开') + chip(D.backup === 'error', 'b:error', '失败') +
      chip(D.rollback, 'rb', '导入副本') + chip(D.remote, 'remote', '远端');
  };
  $('#demobar').addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    const d = b.dataset.d;
    if (d.startsWith('b:')) D.backup = d.slice(2);
    else if (d === 'rb') D.rollback = !D.rollback;
    else if (d === 'remote') D.remote = !D.remote;
    renderBar(); keep(render);
  });

  // ── 开 / 关弹层；抓手和头部可下拉关闭 ──
  const sheet = $('#sheet'), scrim = $('#scrim');
  const open = (to = 'main') => { view = to; render(); $('#sbody').scrollTop = 0; sheet.classList.add('on'); scrim.classList.add('on'); };
  const close = () => { sheet.classList.remove('on', 'dragging'); sheet.style.transform = ''; scrim.classList.remove('on'); };
  $('#entry').addEventListener('click', () => open());
  $('#close').addEventListener('click', close);
  scrim.addEventListener('click', close);
  let y0 = null;
  const down = e => { if (e.target.closest('button')) return; y0 = e.clientY; sheet.classList.add('dragging'); e.currentTarget.setPointerCapture(e.pointerId); };
  const move = e => { if (y0 == null) return; sheet.style.transform = `translateY(${Math.max(0, e.clientY - y0)}px)`; };
  const up = e => {
    if (y0 == null) return;
    const dy = e.clientY - y0; y0 = null;
    sheet.classList.remove('dragging'); sheet.style.transform = '';
    if (dy > 90) close();
  };
  for (const el of [$('#grab'), $('#shead')]) {
    el.addEventListener('pointerdown', down);
    el.addEventListener('pointermove', move);
    el.addEventListener('pointerup', up);
    el.addEventListener('pointercancel', up);
  }

  renderTop();
  renderBar();
  render();
  const q = new URLSearchParams(location.search);
  if (q.has('open')) { sheet.style.transition = scrim.style.transition = 'none'; open(views[q.get('open')] ? q.get('open') : 'main'); }
})();
</script>
</body>
</html>
