<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Demo · 场地标记</title>
<!--
  交互 demo：给一场训练标「在哪个馆练的」。

  已定：Q1 = B（gym 永远显式存字面量，时间线常驻 chip）。
  待验：Q2 = 跨场地那一段连线改虚线（默认态，唯一图元变化）
            + 点数据点出 Tooltip 显示场地（交互态，复用图表本来就有的 Tooltip）
        —— 不给非主场的点做任何记号：断崖发生在「边」上，不在「点」上。

  数据是真的：头顶绳索三头屈伸 / 器械固定二头，取自云端快照 2026-08-28。
  分界日可切，因为用户说的 8.26 和数据里的断崖位置对不上 —— 见页脚。
-->
<style>
  :root{
    --bg-base:#EFE9DC; --bg-card:#FBF8F1; --bg-card-hover:#F5F1E7; --bg-inset:#E7E0D0;
    --divider:#D9D0BC; --rule-strong:#B9AE97;
    --text-primary:#1A1714; --text-secondary:#554E45; --text-tertiary:#665E53;
    --accent:#B23A28; --accent-soft:#F4E3DD; --accent-ink:#8E2C1D; --text-on-accent:#FDFBF6;
    --shadow-page:0 1px 1px rgba(26,23,20,.07);
    --shadow-overlay:0 2px 6px rgba(26,23,20,.10), 0 18px 40px -24px rgba(26,23,20,.30);
    --radius-card:4px;
    --dur-tap:120ms; --ease-paper:cubic-bezier(.2,.8,.2,1);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg-base:#14120F; --bg-card:#1E1B16; --bg-card-hover:#26221B; --bg-inset:#0E0C0A;
      --divider:#332E25; --rule-strong:#4A4232;
      --text-primary:#EDE6D8; --text-secondary:#B3A992; --text-tertiary:#948A78;
      --accent:#E0674B; --accent-soft:#351712; --accent-ink:#ED7A5E; --text-on-accent:#17130F;
      --shadow-page:0 1px 1px rgba(0,0,0,.35);
      --shadow-overlay:0 2px 6px rgba(0,0,0,.45), 0 18px 40px -24px rgba(0,0,0,.80);
    }
  }
  *{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  body{
    background:var(--bg-base); color:var(--text-primary); min-height:100%;
    font:14px/1.5 -apple-system,'PingFang SC','MiSans','Noto Sans SC',sans-serif;
    -webkit-user-select:none; user-select:none; padding-bottom:118px;
  }
  .demotag{ text-align:center; font-size:10px; color:var(--text-tertiary); padding:8px 0 2px; }
  .page{ padding:8px 14px 0; max-width:460px; margin:0 auto; }
  .seclabel{ font-size:10px; letter-spacing:.14em; color:var(--text-tertiary); margin:18px 0 7px; }
  .seclabel:first-of-type{ margin-top:4px; }
  .card{ background:var(--bg-card); border:1px solid var(--divider);
    border-radius:var(--radius-card); box-shadow:var(--shadow-page); overflow:hidden; }
  .note{ font-size:11px; color:var(--text-tertiary); padding:7px 2px 0; line-height:1.65; }
  .note b{ color:var(--accent); font-weight:600; }

  /* ── 场地 chip（Q1=B：永远显示） ── */
  .gymchip{ display:inline-flex; align-items:center; gap:4px; font-size:10.5px; line-height:1;
    padding:3px 6px; border-radius:2px; white-space:nowrap; border:1px solid transparent;
    background:var(--accent-soft); color:var(--accent-ink); }
  .gymchip.away{ background:transparent; border-color:var(--rule-strong);
    border-style:dashed; color:var(--text-secondary); }
  .gymchip svg{ width:9px; height:9px; stroke:currentColor; stroke-width:1.8; fill:none;
    stroke-linecap:round; stroke-linejoin:round; }

  /* ── 图表 ── */
  .exname{ display:flex; align-items:baseline; gap:8px; padding:12px 13px 0; }
  .exname .n{ font-size:14.5px; font-weight:600; }
  .exname .u{ font-size:10.5px; color:var(--text-tertiary); }
  .chartwrap{ position:relative; padding:6px 6px 2px; }
  svg.chart{ display:block; width:100%; height:172px; overflow:visible; }
  .gridline{ stroke:var(--divider); stroke-width:1; stroke-dasharray:2 4; opacity:.65; }
  .axis{ stroke:var(--divider); stroke-width:1; }
  .lbl{ font-size:9px; fill:var(--text-tertiary); }
  .prline{ stroke:var(--accent); stroke-width:1; stroke-dasharray:2 4; opacity:.85; }
  .prlbl{ font-size:9px; fill:var(--accent); font-weight:600; }
  .series{ fill:none; stroke:var(--accent); stroke-width:1.75;
    stroke-linecap:round; stroke-linejoin:round; }
  /* 唯一的图元变化：跨场地那一段不假装连续 */
  .series.crossing{ stroke-dasharray:3 4; opacity:.42; }
  .dot{ fill:var(--accent); }           /* 所有点一视同仁 —— 不给客场点做记号 */
  .hit{ fill:transparent; cursor:pointer; }
  .dot.active{ r:4.4; }

  /* Tooltip（交互态） */
  .tip{ position:absolute; pointer-events:none; opacity:0; transform:translate(-50%,-100%);
    background:var(--bg-card); border:1px solid var(--divider); border-radius:var(--radius-card);
    box-shadow:var(--shadow-overlay); padding:7px 10px; white-space:nowrap;
    transition:opacity var(--dur-tap) var(--ease-paper); }
  .tip.on{ opacity:1; }
  .tip .d{ font-size:10.5px; color:var(--text-tertiary); }
  .tip .v{ font-size:13px; font-weight:600; margin-top:1px; }
  .tip .g{ font-size:10.5px; color:var(--text-secondary); margin-top:3px;
    padding-top:3px; border-top:1px solid var(--divider); }

  /* ── 时间线 ── */
  .tlcard{ padding:10px 13px; border-bottom:1px solid var(--divider); }
  .tlcard:last-child{ border-bottom:0; }
  .tlrow{ display:flex; align-items:center; gap:7px; }
  .tlrow .t{ font-size:14px; font-weight:600; }
  .tlrow .d{ margin-left:auto; font-size:11px; color:var(--text-tertiary); }

  /* ── 切换器 ── */
  .switcher{ position:fixed; left:0; right:0; bottom:0; z-index:30; background:var(--bg-card);
    border-top:1px solid var(--divider); box-shadow:var(--shadow-overlay);
    padding:9px 14px calc(9px + env(safe-area-inset-bottom)); }
  .swrow{ display:flex; align-items:center; gap:8px; max-width:460px; margin:0 auto; }
  .swrow + .swrow{ margin-top:7px; }
  .swrow .q{ font-size:10.5px; color:var(--text-tertiary); width:96px; flex:none; }
  .segs{ display:flex; border:1px solid var(--divider); border-radius:var(--radius-card);
    overflow:hidden; flex:1; }
  .segs button{ appearance:none; font-family:inherit; font-size:11px; cursor:pointer; flex:1;
    padding:5px 4px; border:0; background:none; color:var(--text-secondary); }
  .segs button + button{ border-left:1px solid var(--divider); }
  .segs button[aria-pressed="true"]{ background:var(--accent-soft); color:var(--accent-ink); font-weight:600; }
</style>
</head>
<body>

<div class="demotag">DEMO · 场地标记 · 非产品页面</div>

<div class="page">

  <div class="seclabel">① 趋势图 · 默认态（点一下数据点看 Tooltip）</div>
  <div class="card" id="charts"></div>
  <div class="note" id="chartnote"></div>

  <div class="seclabel">② 时间线 · Q1=B，场地常驻</div>
  <div class="card" id="tl"></div>

  <div class="seclabel">③ 对不上的地方</div>
  <div class="note" id="mismatch"></div>

</div>

<div class="switcher">
  <div class="swrow">
    <div class="q">跨场地虚线</div>
    <div class="segs" id="qLine">
      <button data-v="on" aria-pressed="true">开（提案）</button>
      <button data-v="off" aria-pressed="false">关（纯 Tooltip）</button>
    </div>
  </div>
  <div class="swrow">
    <div class="q">回多伦多的日期</div>
    <div class="segs" id="qCut">
      <button data-v="0826" aria-pressed="true">8月26日（你说的）</button>
      <button data-v="0810" aria-pressed="false">8月10日（数据像的）</button>
    </div>
  </div>
</div>

<script>
const HOME = 'F4L';
const AWAY = '国内';
const state = { line:'on', cut:'0826' };

/* 真实数据（云端快照 2026-08-28）。val = 该场此动作的最大单组重量 kg。 */
const EX = [
  { name:'头顶绳索三头屈伸', pts:[
      {md:'6月7日',  d:20260607, val:30},
      {md:'6月18日', d:20260618, val:35},
      {md:'8月10日', d:20260810, val:13.5},
      {md:'8月26日', d:20260826, val:15},
  ]},
  { name:'器械固定二头', pts:[
      {md:'6月18日', d:20260618, val:25},
      {md:'7月2日',  d:20260702, val:25},
      {md:'7月23日', d:20260723, val:25},
      {md:'8月10日', d:20260810, val:25},
      {md:'8月26日', d:20260826, val:24.95},
  ]},
];

const TIMELINE = [
  { t:'练手臂', md:'8月26日', d:20260826 },
  { t:'练肩',   md:'8月23日', d:20260823 },
  { t:'练背',   md:'8月18日', d:20260818 },
  { t:'练胸',   md:'8月14日', d:20260814 },
];

const cutDate = () => state.cut === '0826' ? 20260826 : 20260810;
const gymOf = d => d >= cutDate() ? HOME : AWAY;

const NS='http://www.w3.org/2000/svg';
const el=(n,a)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);return e;};
const PIN='<svg viewBox="0 0 24 24"><path d="M12 21s7-6.4 7-11a7 7 0 1 0-14 0c0 4.6 7 11 7 11z"/><circle cx="12" cy="10" r="2.4"/></svg>';

function chip(gym){
  return `<span class="gymchip ${gym===HOME?'':'away'}">${PIN}${gym}</span>`;
}

function renderCharts(){
  document.getElementById('charts').innerHTML = EX.map((ex,k)=>`
    <div${k?' style="border-top:1px solid var(--divider)"':''}>
      <div class="exname"><span class="n">${ex.name}</span><span class="u">kg · 最大单组</span></div>
      <div class="chartwrap">
        <svg class="chart" id="c${k}" viewBox="0 0 320 172"></svg>
        <div class="tip" id="t${k}"></div>
      </div>
    </div>`).join('');
  EX.forEach((ex,k)=>drawChart(k,ex));
}

function drawChart(k, ex){
  const s=document.getElementById('c'+k); s.innerHTML='';
  const W=320,H=172,L=28,R=40,T=14,B=24;
  const iw=W-L-R, ih=H-T-B;
  const maxV=Math.max(...ex.pts.map(p=>p.val));
  const top=Math.ceil(maxV/10)*10 || 10;
  const x=i=>L+(iw*i)/(ex.pts.length-1);
  const y=v=>T+ih-(ih*v)/top;

  for(let v=0; v<=top; v+=top/4){
    s.appendChild(el('line',{class:'gridline',x1:L,x2:W-R,y1:y(v),y2:y(v)}));
    const t=el('text',{class:'lbl',x:L-5,y:y(v)+3,'text-anchor':'end'}); t.textContent=+v.toFixed(0); s.appendChild(t);
  }
  s.appendChild(el('line',{class:'axis',x1:L,x2:W-R,y1:y(0),y2:y(0)}));

  // PR 参考线（计算逻辑一行没动：全量历史最大值）
  s.appendChild(el('line',{class:'prline',x1:L,x2:W-R,y1:y(maxV),y2:y(maxV)}));
  const pl=el('text',{class:'prlbl',x:W-R+4,y:y(maxV)+3}); pl.textContent='最好 '+ (+maxV.toFixed(2)); s.appendChild(pl);

  // 连线：只有跨场地那一段变虚
  for(let i=0;i<ex.pts.length-1;i++){
    const a=ex.pts[i], b=ex.pts[i+1];
    const crossing = state.line==='on' && gymOf(a.d)!==gymOf(b.d);
    s.appendChild(el('line',{class:'series'+(crossing?' crossing':''),
      x1:x(i),y1:y(a.val),x2:x(i+1),y2:y(b.val)}));
  }

  // 数据点：全部一样，不做客场记号
  ex.pts.forEach((p,i)=>{
    s.appendChild(el('circle',{class:'dot',id:`d${k}_${i}`,cx:x(i),cy:y(p.val),r:2.8}));
    const hit=el('circle',{class:'hit',cx:x(i),cy:y(p.val),r:15});
    hit.addEventListener('click',ev=>{ev.stopPropagation();showTip(k,i,x(i),y(p.val),p);});
    s.appendChild(hit);
    const t=el('text',{class:'lbl',x:x(i),y:H-8,'text-anchor':'middle'});
    t.textContent=p.md; s.appendChild(t);
  });
}

function showTip(k,i,px,py,p){
  document.querySelectorAll('.tip').forEach(t=>t.classList.remove('on'));
  document.querySelectorAll('.dot').forEach(d=>d.setAttribute('r','2.8'));
  document.getElementById(`d${k}_${i}`).setAttribute('r','4.4');
  const tip=document.getElementById('t'+k);
  const wrap=tip.parentElement, sw=wrap.querySelector('svg').getBoundingClientRect();
  tip.innerHTML=`<div class="d">2026年 ${p.md}</div><div class="v">${p.val} kg</div>`+
    `<div class="g">${PIN.replace('<svg','<svg style="width:9px;height:9px;stroke:currentColor;stroke-width:1.8;fill:none;vertical-align:-1px"')} ${gymOf(p.d)}</div>`;
  tip.style.left = (6 + sw.width*px/320) + 'px';
  tip.style.top  = (6 + sw.height*py/172 - 10) + 'px';
  tip.classList.add('on');
}
document.addEventListener('click',()=>{
  document.querySelectorAll('.tip').forEach(t=>t.classList.remove('on'));
  document.querySelectorAll('.dot').forEach(d=>d.setAttribute('r','2.8'));
});

function renderTimeline(){
  document.getElementById('tl').innerHTML = TIMELINE.map(w=>`
    <div class="tlcard"><div class="tlrow">
      <span class="t">${w.t}</span>${chip(gymOf(w.d))}<span class="d">${w.md}</span>
    </div></div>`).join('');
}

function renderNotes(){
  document.getElementById('chartnote').innerHTML = state.line==='on'
    ? '默认态：<b>整张图只多了一段虚线</b> —— 没有新图元、没有图例、没有第二种颜色，客场的点也不做任何记号。虚线的意思不是「这里有个场地」，而是「这两个点之间的刻度断了，别连着读」。点任意数据点出 Tooltip，最后一行才是场地。'
    : '纯 Tooltip 态：曲线跟现在完全一样，场地只能靠逐点戳出来。断崖依然是个谜，而解谜的前提是你先怀疑它有问题。';

  const cut = state.cut==='0826' ? '8月26日' : '8月10日';
  document.getElementById('mismatch').innerHTML = state.cut==='0826'
    ? `按 <b>8月26日</b> 分界：头顶绳索三头屈伸真正的断崖（35 → 13.5）落在 6月18日 → 8月10日，<b>两边都算国内</b>，虚线画不到它身上；而虚线画上的那一段（13.5 → 15）几乎是平的。也就是说这个功能对你唯一一个真实痛点<b>不起作用</b>。<br><br>切到 8月10日看看。`
    : `按 <b>8月10日</b> 分界：虚线正好落在断崖上，35 → 13.5 一眼读得懂。器械固定二头那张也对得上（25 → 24.95，跨场地但几乎没变，说明那台器械两边刻度一样）。<br><br>数据是这么说的。要么你是 8月10日 前后回的多伦多，要么 8月10日 那场是在国内的<b>另一个</b>馆练的。你自己确认一下 —— 这决定了回填的分界日写哪天。`;
}

function renderAll(){ renderCharts(); renderTimeline(); renderNotes(); }

['qLine','qCut'].forEach(id=>{
  document.getElementById(id).addEventListener('click',e=>{
    const b=e.target.closest('button'); if(!b) return;
    state[id==='qLine'?'line':'cut']=b.dataset.v;
    [...e.currentTarget.children].forEach(c=>c.setAttribute('aria-pressed',String(c===b)));
    renderAll();
  });
});

renderAll();
</script>
</body>
</html>
