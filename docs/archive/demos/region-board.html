  function applyPhoneClasses() {
    $('#phone').classList.toggle('chipscroll', S.chips === 'scroll');
  }
  function setOpt(k, v) {
    S[k] = k === 'review' ? v === 'true' : v;
    applyPhoneClasses();
    renderPanel();
    renderFilters();
    renderResults();
    if (!$('#table').hidden) renderTable();
  }

  /* ───────────── 总表（demo 用，Modal full 的样子） ───────────── */

  function tItem(ex) {
    const struck = S.struck.has(ex.id);
    const notes = [];
    if (ex.flag === 'new') notes.push('<em>新</em>');
    if (ex.own) notes.push('<em class="old">自建</em>');
    if (ex.aliases.length) notes.push(`<em class="old">原「${esc(ex.aliases.join('」「'))}」${ex.flag === 'typo' ? '，疑似笔误' : ''}</em>`);
    if (ex.note) notes.push(`<em class="old">${esc(ex.note)}</em>`);
    if (effRegion(ex).guessed) notes.push('<em>猜的</em>');
    return `<button type="button" class="ti${struck ? ' struck' : ''}" data-act="strike" data-v="${ex.id}" aria-pressed="${struck}">${esc(ex.name)}${notes.join('')}</button>`;
  }
  function renderTable() {
    const el = $('#table');
    const prev = el.querySelector('.bd');
    const top = prev ? prev.scrollTop : 0;
    const live = LIB.filter(e => !e.hidden);
    const base = live.filter(e => !e.own && e.flag !== 'new').length;
    const ren = live.filter(e => e.flag === 'ren' || e.flag === 'typo').length;
    const add = live.filter(e => e.flag === 'new').length;
    const own = live.filter(e => e.own).length;
    const nReg = Object.values(REG).reduce((n, l) => n + l.length, 0);
    const tRow = (label, arr) => `<div class="trow"><span class="rg">${esc(label)}</span><span class="its">${arr.length ? arr.map(tItem).join('') : '<span class="ti blank">—</span>'}</span></div>`;
    const gh = (title, n, sub) => `<div class="gh">${svg('columns', 13, 2, 'acc')}<h3>${esc(title)}</h3><span class="n">· ${n}${sub ? ' · ' + esc(sub) : ''}</span></div>`;
    const parts = PARTS.map(p => {
      const items = live.filter(e => e.part === p.id && e.cat === 'S');
      const regs = regionsOf(p.id);
      if (!items.length && !regs.length) return '';
      const rows = regs.map(r => tRow(r.name, items.filter(e => effRegion(e).id === r.id).sort(byOrder))).join('');
      const un = items.filter(e => !effRegion(e).id).sort(byOrder);
      return `<section class="tpart">${gh(p.name, items.length)}${rows}${un.length ? tRow('未细分', un) : ''}</section>`;
    }).join('');
    const flat = (title, cat) => {
      const arr = live.filter(e => e.cat === cat).sort(byOrder);
      return arr.length ? `<section class="tpart">${gh(title, arr.length, '不分细分')}<div class="trow"><span class="its">${arr.map(tItem).join('')}</span></div></section>` : '';
    };
    el.innerHTML =
      `<div class="hd"><h2>细分总表 · 初稿</h2><button type="button" class="sicon" data-act="table-close" aria-label="关闭总表">${svg('x', 20, 1.75)}</button></div>` +
      '<div class="bd">' +
      `<p class="tstat">内置 ${base}（其中改名 ${ren}）· 新增候选 ${add} · 你的自建 ${own} · 细分 ${nReg}</p>` +
      '<ol class="rules">' +
      '<li>一个动作只落一列。</li>' +
      '<li>同一个动作换个做法就会换列的（上斜 / 下斜、低位 / 高位绳索、宽距），拆成两个动作；只换手感的（握法、节奏、单侧 / 双侧）归第 8 条的「练法」，不拆。</li>' +
      '<li>标「新」的是这次补的候选。正式入库前要先跟你的自建动作对一遍，同一个动作的不加；这次没读到你的真实数据，还没对。</li>' +
      '<li>写着「原……」的是改了名的：旧名记成曾用名，历史记录照样认，搜旧名也能搜到。</li>' +
      '<li>有氧、自由不分细分，也不进腿、背的细分列。</li>' +
      '</ol>' +
      '<p>点动作可以划掉。在弹层里长按改细分、改名，或在标签管理里新建细分，改动都会记进「复制修改」。</p>' +
      parts + flat('有氧', 'C') + flat('自由', 'F') +
      '<textarea class="copyfallback" id="copyFallback" readonly hidden aria-label="修改清单"></textarea>' +
      '</div>' +
      `<div class="ftbar"><span>已划掉 ${S.struck.size} 个</span><button type="button" data-act="copy">复制修改</button></div>`;
    const bd = el.querySelector('.bd');
    if (bd) bd.scrollTop = top;
  }
  function openTable() {
    $('#table').hidden = false;
    renderTable();
  }
  function closeTable() {
    $('#table').hidden = true;
  }
  function toggleStrike(id) {
    if (S.struck.has(id)) S.struck.delete(id); else S.struck.add(id);
    renderTable();
    renderFilters();
    renderResults();
  }

  function summaryText() {
    const lines = ['【部位细分 demo · 我的修改】'];
    const init = new Map(INIT.lib.map(e => [e.id, e]));
    const regIn = (reg, rid) => { for (const l of Object.values(reg)) { const r = l.find(x => x.id === rid); if (r) return r.name; } return rid; };
    const struck = LIB.filter(e => S.struck.has(e.id)).map(e => e.name);
    const moved = [], parted = [], renamed = [], deleted = [], created = [];
    for (const e of LIB) {
      const o = init.get(e.id);
      if (!o) {
        if (!e.hidden) created.push(`${e.name}（${PART[e.part].name}${e.region ? ' · ' + regionName(e.region) : ''}）`);
        continue;
      }
      if (e.hidden && !o.hidden) deleted.push(e.name);
      if (e.name !== o.name) renamed.push(`${o.name} → ${e.name}`);
      if (e.part !== o.part) parted.push(`${e.name}：${PART[o.part].name} → ${PART[e.part].name}`);
      if (e.regionSet && (o.region || null) !== (e.region || null)) {
        moved.push(`${e.name}：${o.region ? regIn(INIT.reg, o.region) : '未细分'} → ${e.region ? regionName(e.region) : '未细分'}`);
      }
    }
    const regLines = [];
    for (const p of PARTS) {
      const before = INIT.reg[p.id] || [], after = REG[p.id] || [];
      for (const r of after) {
        const b = before.find(x => x.id === r.id);
        if (!b) regLines.push(`新建细分：${p.name} · ${r.name}`);
        else if (b.name !== r.name) regLines.push(`细分改名：${p.name} · ${b.name} → ${r.name}`);
      }
      for (const b of before) if (!after.some(x => x.id === b.id)) regLines.push(`删除细分：${p.name} · ${b.name}`);
    }
    if (struck.length) lines.push('划掉：' + struck.join('、'));
    if (moved.length) lines.push('改细分：' + moved.join('；'));
    if (parted.length) lines.push('改部位：' + parted.join('；'));
    if (renamed.length) lines.push('改名：' + renamed.join('；'));
    if (deleted.length) lines.push('从动作库删除：' + deleted.join('、'));
    if (created.length) lines.push('新建动作：' + created.join('、'));
    regLines.forEach(l => lines.push(l));
    if (lines.length === 1) lines.push('（没有改动）');
    lines.push(`看的时候选的：细分列 ${OPT_LABEL.layout[S.layout]}，列内排序 ${OPT_LABEL.sort[S.sort]}，自建动作 ${OPT_LABEL.own[S.own]}，筛选两行 ${OPT_LABEL.chips[S.chips]}`);
    return lines.join('\n');
  }
  function copySummary() {
    const text = summaryText();
    const fallback = () => {
      const ta = $('#copyFallback');
      if (!ta) return;
      ta.hidden = false;
      ta.value = text;
      ta.focus();
      ta.select();
      ta.scrollIntoView({ block: 'nearest' });
      toast('没能直接复制，下面框里已经全选，手动复制一下');
    };
    try {
      const p = navigator.clipboard && navigator.clipboard.writeText(text);
      if (p && p.then) p.then(() => toast('已复制，贴回对话里就行'), fallback);
      else fallback();
    } catch (e) {
      fallback();
    }
  }

  /* ───────────── 事件分发 ───────────── */

  function act(name, el) {
    const v = el.dataset.v;
    switch (name) {
      case 'noop': return;
      case 'seal': return choosePart(el.dataset.part);
      case 'seal-other':
        S.partChosen = true;
        renderBench();
        setTimeout(() => $('#woTitle').focus(), 0);
        return;
      case 'open-sheet': return openSheet(null);
      case 'close-sheet': return closeSheet();
      case 'axis': {
        const k = el.dataset.kind;
        if (!k || (S.axis && S.axis.kind === k && S.axis.v === v)) S.axis = null;
        else S.axis = { kind: k, v };
        renderFilters();
        renderResults();
        R.scrollTop = 0;
        return;
      }
      case 'equip':
        if (S.equips.has(v)) S.equips.delete(v); else S.equips.add(v);
        renderFilters();
        renderResults();
        return;
      case 'clear-filters':
        S.axis = null;
        S.equips = new Set();
        renderFilters();
        renderResults();
        return;
      case 'clear-q':
        S.query = '';
        $('#q').value = '';
        renderHead();
        renderFilters();
        renderResults();
        $('#q').focus();
        return;
      case 'star': return toggleStar(v);
      case 'new-ex': return openEditorNew(v != null ? v : S.query.trim());
      case 'tag-manage': return openManage(false);
      case 'menu-close': return closeMenu();
      case 'assign': return assignRegion(menuEx, v);
      case 'menu-tags': { const id = menuEx; closeMenu(); return openEditor(id); }
      case 'menu-star': { const id = menuEx; closeMenu(); return toggleStar(id); }
      case 'menu-rename': { const id = menuEx; closeMenu(); return openRename({ kind: 'ex', id }); }
      case 'menu-delete': { const id = menuEx; closeMenu(); return deleteExercise(id); }
      case 'ed-part': ED.part = v; ED.region = null; ED.adding = false; ED.regErr = ''; return renderEditor();
      case 'ed-region': ED.region = v || null; return renderEditor();
      case 'ed-eq': if (ED.tags.has(v)) ED.tags.delete(v); else ED.tags.add(v); return renderEditor();
      case 'ed-cat': ED.cat = v; ED.region = null; ED.adding = false; return renderEditor();
      case 'ed-newregion':
        ED.adding = true;
        renderEditor();
        setTimeout(() => { const i = $('#edNewRegion'); if (i) i.focus(); }, 30);
        return;
      case 'ed-newregion-ok': return editorAddRegion();
      case 'ed-save': return editorSave();
      case 'mg-rename': return openRename({ kind: 'region', id: v, part: el.dataset.p, back: 'manage' });
      case 'mg-new': return openNewRegion(el.dataset.p);
      case 'mg-del': return deleteRegion(el.dataset.p, v);
      case 'rn-ok': return renameOk();
      case 'nr-ok': return newRegionOk();
      case 'modal-back': return modalBack();
      case 'modal-close': return closeModal();
      case 'plan': return togglePanel();
      case 'opt': return setOpt(el.dataset.k, v);
      case 'table-open': togglePanel(false); return openTable();
      case 'table-close': return closeTable();
      case 'strike': return toggleStrike(v);
      case 'copy': return copySummary();
      case 'toast-close': return closeToast();
      case 'reset':
        togglePanel(false);
        closeModal();
        closeMenu();
        closeTable();
        closeToast();
        reset();
        renderAll();
        return;
      case 'undo': return runUndo();
    }
  }

  $('#phone').addEventListener('click', e => {
    if (!$('#panel').hidden && !e.target.closest('#panel') && !e.target.closest('#btnPlan')) togglePanel(false);
    const a = e.target.closest('[data-act]');
    if (a) act(a.dataset.act, a);
  });
  $('#q').addEventListener('input', e => {
    S.query = e.target.value;
    renderHead();
    renderFilters();
    renderResults();
  });
  $('#q').addEventListener('keydown', e => { if (e.key === 'Enter') e.target.blur(); });
  $('#woTitle').addEventListener('input', e => { S.title = e.target.value; });
  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    if (!$('#panel').hidden) togglePanel(false);
    else if ($('#modal').classList.contains('on')) modalBack();
    else if ($('#menu').classList.contains('on')) closeMenu();
    else if (!$('#table').hidden) closeTable();
    else if (S.sheetOpen) closeSheet();
  });

  function renderAll() {
    applyPhoneClasses();
    renderBench();
    renderSheet();
    if (!$('#panel').hidden) renderPanel();
    if (!$('#table').hidden) renderTable();
  }

  reset();
  renderAll();
})();
</script>
</body>
</html>
