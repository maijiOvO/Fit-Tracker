<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>FitLog AI</title>
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#EFE9DC" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#14120F" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#EFE9DC" data-dynamic="true">

    <script>
      (function () {
        var pref = localStorage.getItem('theme-pref') || 'auto';
        var dark = pref === 'dark' || (pref === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
        var meta = document.querySelector('meta[name="theme-color"][data-dynamic]');
        if (meta) meta.setAttribute('content', dark ? '#14120F' : '#EFE9DC');

        // 动效三态（§5.6）。和主题一样在首帧之前贴上，避免第一帧用错档位。
        var motion = localStorage.getItem('fitlog_reduced_motion');
        if (motion === 'on' || motion === 'off') {
          document.documentElement.setAttribute('data-reduced-motion', motion === 'on' ? '1' : '0');
        }
      })();
    </script>

    <!-- 字体全部自托管（见 index.css §3 注释）。crossorigin 即使同源也必须写，
         否则预加载的字体不会被字体加载器复用，会重下一遍。 -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/noto-sans-sc.woff2">
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/noto-serif-sc.woff2">
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/plex-mono-500.woff2">
    <link rel="manifest" href="/manifest.json" />
</head>
<body>
    <div id="root"></div>
    <script>
        if ('serviceWorker' in navigator && location.protocol !== 'http:') {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').catch(err => {
                    console.log('SW registration failed: ', err);
                });
            });
        }

        document.addEventListener('touchstart', (event) => {
            if (event.touches.length > 1) {
                event.preventDefault();
            }
        }, { passive: false });
    </script>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
