<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Fit Tracker</title>
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0D1216" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#FFFFFF" data-dynamic="true">

    <script>
      (function () {
        // Vite substitutes this flag in demo builds. The demo starts fresh and
        // light even when the system or another FitLog environment is dark.
        var demo = '%VITE_FITLOG_DEMO%' === 'true';
        // 主题 / 强调色存在按环境分区的 key 里（services/appEnv.ts storagePrefix：demo: / solo: / dev: / 无前缀），
        // 这里照抄同一套判断，否则单机版 / 开发环境每次启动先按默认色画一帧再跳（审查 C）
        var solo = '%VITE_FITLOG_SOLO%' === 'true';
        var prefix = demo ? 'demo:' : solo ? 'solo:' : '';
        try {
          var cap = window.Capacitor;
          var nativeApp = !!(cap && (typeof cap.isNativePlatform === 'function' ? cap.isNativePlatform() : cap.isNative));
          if (!demo && !solo && !nativeApp && '%VITE_FITLOG_ENV%' !== 'prod') {
            var dm = localStorage.getItem('fitlog_dev_mode');
            if (dm !== null ? dm === 'true' : '%VITE_FITLOG_DEV_MODE%' !== 'false') prefix = 'dev:';
          }
        } catch (_) {}
        var pref = 'auto';
        try { pref = localStorage.getItem(prefix + 'theme-pref') || 'auto'; } catch (_) {}
        if (demo) pref = 'light';
        var dark = pref === 'dark' || (pref === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
        // 强调色（青 / 玫红），和 useTheme.ts 的 BASE_COLOR 同步
        var accent = 'teal';
        try {
          var a = localStorage.getItem(prefix + 'accent-pref');
          if (/^(teal|rose|violet|orange|sky)$/.test(a)) accent = a;
        } catch (_) {}
        document.documentElement.setAttribute('data-accent', accent);
        var meta = document.querySelector('meta[name="theme-color"][data-dynamic]');
        if (meta) meta.setAttribute('content', dark ? (accent === 'teal' || accent === 'sky' ? '#0D1216' : '#0A0A0C') : '#FFFFFF');

        // 动效三态（§5.6）。和主题一样在首帧之前贴上，避免第一帧用错档位。
        var motion = localStorage.getItem('fitlog_reduced_motion');
        if (motion === 'on' || motion === 'off') {
          document.documentElement.setAttribute('data-reduced-motion', motion === 'on' ? '1' : '0');
        }
      })();
    </script>

    <!-- 字体全部自托管（见 index.css §3 注释）。crossorigin 即使同源也必须写，
         否则预加载的字体不会被字体加载器复用，会重下一遍。 -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/noto-sans-sc.woff2">
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/barlow-condensed-600.woff2">
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/barlow-condensed-700.woff2">
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/smiley-sans.woff2">
    <!-- 印章字体也要预加载：它配的是 font-display: block（见 index.css），
         不预加载的话首屏会先空着等它下完。19KB，而且开练第一屏就要用。 -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/ma-shan-zheng.woff2">
    <link rel="manifest" href="/manifest.json" />
</head>
<body>
    <div id="root"></div>
    <script>
        if ('serviceWorker' in navigator && location.protocol !== 'http:') {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').catch(err => {
                    console.log('SW registration failed: ', err);
                });
            });
        }

        document.addEventListener('touchstart', (event) => {
            if (event.touches.length > 1) {
                event.preventDefault();
            }
        }, { passive: false });
    </script>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
